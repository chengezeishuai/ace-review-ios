name: Export Signed ACE Review IPA

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-14
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate release configuration
        env:
          ACE_API_BASE_URL: ${{ vars.ACE_API_BASE_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          case "$ACE_API_BASE_URL" in https://*) ;; *) echo "ACE_API_BASE_URL must use HTTPS" >&2; exit 1;; esac

      - name: Install signing assets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ace-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$GITHUB_RUN_ID" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$GITHUB_RUN_ID" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/ace.mobileprovision"

      - name: Archive and export IPA
        env:
          ACE_API_BASE_URL: ${{ vars.ACE_API_BASE_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project ACEReview.xcodeproj -scheme "ACE Review" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath build/ACEReview.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" ACE_API_BASE_URL="$ACE_API_BASE_URL" archive
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$APPLE_TEAM_ID</string></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ACEReview.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export

      - uses: actions/upload-artifact@v4
        with:
          name: ACEReview-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error
