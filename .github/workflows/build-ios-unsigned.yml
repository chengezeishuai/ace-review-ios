name: Build ACE Review iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置（测试包使用 Debug，正式包必须配置 HTTPS 域名）
        required: true
        default: Debug
        type: choice
        options: [Debug, Release]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ACEReview.xcodeproj \
            -scheme "ACE Review" \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/ACEReview.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "build/ACEReview.xcarchive/Products/Applications/ACE Review.app" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/ACEReview-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ACEReview-${{ inputs.configuration || 'Release' }}-unsigned-ipa
          path: build/ACEReview-unsigned.ipa
          if-no-files-found: error
